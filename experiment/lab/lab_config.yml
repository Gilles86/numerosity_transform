# Settings for lab.py (the lab launcher). Edit before the first lab session.

# Screen settings file in settings/ (lab.yml = BLU lab client screens)
settings: lab

# Network folder the clients can write to; results are copied here after every phase and read back to find out
# which session a participant is in. TODO: check the shortname (your UZH shortname) and that the folder exists.
results_dir: 'N:\client_write\gdehol\numerosity_transform'

# Local log folder on each client. Must be OUTSIDE C:\ExpFiles, because Lab Control's mirroring deletes everything
# there that is not on the network share.
local_log_dir: '~/numerosity_transform_logs'

# Participant number from the computer number: participant = computer number + subject_offset, filled in (and still
# editable) in the first dialog. Use when every participant keeps the same seat in all sessions, e.g. group A on
# computers 1-30 (offset 0 -> participants 1-30) and group B on computers 1-5 (offset 30 -> participants 31-35).
# false: the participant number is typed in from the seating card.
subject_from_computer: false
subject_offset: 0

# Where collect.bat (on the ExpMaster) copies the results to: the project's data folder on the department share.
# Copies only add or update files there, never delete.
archive_dir: 'Z:\Department\projects\2026\dehollander_bedi_ruff_abstract_values\data\ds-numtransform'
