window:
  size: [1200, 800]
  pos: [0, 0]
  color: [0, 0, 0]
  fullscr: False
  winType: pyglet
  screen: 0

monitor:
  name: default
  width: 30
  distance: 50  # cm
  gamma: 1

mouse:
  visible: False

# Numerosity (number of dots) -> value in CHF. Pick one with --mapping. Numerosities: 23 evenly spaced levels from 1 to 50, rounded to whole dots.
# Concave/convex: 1 + 49 h(x), x = (n - 1) / 49 (h: see numeral.curvature; convex is 1 - h(1 - x)), rounded to 0.5 CHF.
mappings:
  numerosities: [1, 3, 5, 8, 10, 12, 14, 17, 19, 21, 23, 25, 28, 30, 32, 34, 37, 39, 41, 43, 46, 48, 50]
  linear:  [1, 3, 5, 8, 10, 12, 14, 17, 19, 21, 23, 25, 28, 30, 32, 34, 37, 39, 41, 43, 46, 48, 50]
  concave: [1.0, 6.5, 11.5, 18.0, 22.0, 25.5, 28.5, 32.0, 34.5, 36.5, 38.5, 40.0, 42.0, 43.0, 44.5, 45.0, 46.5, 47.0, 48.0, 48.5, 49.0, 49.5, 50.0]
  convex:  [1.0, 1.5, 2.0, 2.5, 3.0, 4.0, 4.5, 6.0, 6.5, 8.0, 9.0, 10.5, 12.5, 14.5, 16.5, 19.0, 22.5, 25.5, 29.0, 33.0, 39.5, 44.5, 50.0]

# Arabic-numeral version (--stimulus numeral, concave and convex only). Number 1 is worth 1 CHF and 50 is worth 50 CHF:
# same range as the numerosities and slider.range.
numeral:
  range: [1, 50]
  decimals: 2
  text_height: 1.0           # deg
  n_bins: 23                 # one random number per bin per repeat; also the number of screens in the examples phase
  curvature: 2.79            # k in (1 - exp(-k x)) / (1 - exp(-k)); also generates the mapping tables above
  response_precision: 0.01   # CHF; replaces slider.precision (typed answers, slider steps, auction prices)
  feedback_tolerance: 0.5    # CHF; training feedback is green within this distance of the true value

cloud:
  aperture_radius: 2.5  # deg
  dot_radius: .1        # deg
  min_ecc: .4           # deg; no dots closer to the centre (fixation cross half-length .25 + margin)

fixation_cross:
  size: 0.5
  color: white
  line_width: 5

response: typing  # type the number, ENTER confirms; or slider (mouse, click confirms). --response overrides

slider:
  length: 10
  height: .5
  range: [1, 50]
  precision: 0.5
  text_height: .5

various:
  text_width: 30
  text_height: .6
  text_color: [1, 1, 1]

# Seconds
durations:  # main task
  green_fixation: 0.3
  white_fixation: 0.2
  stimulus: 1.0
  isis: [0.5, 0.75, 1.0]  # sampled per trial
  response: 4.0
  feedback: 1.0
  iti: 0.5

durations_training:
  green_fixation: 0.3
  white_fixation: 0.2
  stimulus: 1.0
  response: 5.0
  feedback: 1.0
  iti: 0.5

training:
  n_repeats: 6  # presentations of each numerosity
  n_blocks: 6

main_task:
  n_repeats: 2  # presentations of each numerosity per run
  n_runs: 4
  reward_scaling: 184.0  # = n_runs x n_repeats x 23 trials, so the payout is the mean trial outcome (as in abstract_values)
  show_up_fee: 30.0      # CHF (abstract_values v5 booklets; TODO confirm)
