window:
  size: [1200, 800]
  pos: [0, 0]
  color: [0, 0, 0]
  fullscr: False
  winType: pyglet
  screen: 0

monitor:
  name: default
  width: 30
  distance: 50  # cm
  gamma: 1

mouse:
  visible: False

# Numerosity (number of dots) -> value in CHF. Pick one with --mapping. Every whole number of dots from 1 to 50 can appear.
# Value = 1 + 49 h(x), x = (n - 1) / 49: linear h(x) = x; concave h(x) = (1 - exp(-kx)) / (1 - exp(-k)) with k = numeral.curvature;
# convex 1 - h(1 - x). Rounded to value_precision.
numerosity:
  range: [1, 50]
  n_bins: 23             # each pass over the range draws one number of dots from each of 23 near-equal groups of 1-50
  n_examples: 25         # evenly spaced numbers of dots shown in the examples phase
  value_precision: 0.5   # CHF

# Arabic-numeral version (--stimulus numeral, concave and convex only). Number 1 is worth 1 CHF and 50 is worth 50 CHF:
# same range as numerosity.range and slider.range.
numeral:
  range: [1, 50]
  decimals: 2
  text_height: 1.0           # deg
  n_bins: 23                 # one random number per bin per repeat
  n_examples: 25             # evenly spaced numbers shown in the examples phase
  curvature: 2.79            # k in (1 - exp(-k x)) / (1 - exp(-k)); shared with the numerosity mappings
  response_precision: 0.01   # CHF; replaces slider.precision (typed answers, slider steps, auction prices)
  feedback_tolerance: 0.5    # CHF; training feedback is green within this distance of the true value

cloud:
  aperture_radius: 2.5  # deg
  dot_radius: .1        # deg
  min_ecc: .4           # deg; no dots closer to the centre (fixation cross half-length .25 + margin)

fixation_cross:
  size: 0.5
  color: white
  line_width: 5

response: typing  # type the number, ENTER confirms; or slider (mouse, click confirms). --response overrides

slider:
  length: 10
  height: .5
  range: [1, 50]
  precision: 0.5
  text_height: .5

various:
  text_width: 30
  text_height: .6
  text_color: [1, 1, 1]

# Seconds
durations:  # main task
  green_fixation: 0.3
  white_fixation: 0.2
  stimulus: 1.0
  isis: [0.5, 0.75, 1.0]  # sampled per trial
  response: 4.0
  feedback: 1.0
  iti: 0.5

durations_training:
  green_fixation: 0.3
  white_fixation: 0.2
  stimulus: 1.0
  response: 5.0
  feedback: 1.0
  iti: 0.5

training:
  n_repeats: 6  # presentations of each numerosity
  n_blocks: 6

main_task:
  n_repeats: 2  # presentations of each numerosity per run
  n_runs: 4
  reward_scaling: 920.0  # = 5 x (n_runs x n_repeats x 23 trials): the session bonus is 1/5 of the mean trial outcome (10-20 CHF)
  show_up_fee: 15.0      # CHF per session
  completion_bonus: 20.0 # CHF, paid once after the last session
  n_sessions: 4
