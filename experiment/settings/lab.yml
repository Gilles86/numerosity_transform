# BLU lab client PCs: Dell P2425D (23.8", 2560x1440 QHD, active area 52.70 x 29.65 cm, up to 100 Hz; photo of the label
# 2026-11-13, manufactured Jul 2025). Overrides default.yml.
# window.size must equal the resolution Windows reports: [2560, 1440] at 100% scaling; at 125% use [2048, 1152].
